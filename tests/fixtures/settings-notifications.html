<!doctype html>
<!-- Reduced copy of discogs.com/settings/notifications (observed on 2026-11-24). -->
<html lang="en">
  <body>
    <form action="https://www.discogs.com/settings/notifications" method="post">
      <h2 id="marketplace-notifications">Marketplace Notifications</h2>
      <table class="notifications_table table_block table_responsive">
        <thead><tr><td class="as_table_cell">Notifications</td><td class="as_table_cell">Personal Email</td><td></td></tr></thead>
        <tr class="odd">
          <td class="textcenter as_table_cell"></td>
          <td class="textcenter as_table_cell">
            <input type="checkbox" name="email" value="5" aria-label="Send message When a release in my wantlist is listed for sale to my personal email." checked="checked">
          </td>
          <td width="100%">When a release in my wantlist is listed for sale</td>
        </tr>
        <tr class="even">
          <td class="textcenter as_table_cell"><input type="checkbox" name="notify" value="6" checked="checked"></td>
          <td class="textcenter as_table_cell"><input type="checkbox" name="email" value="6" checked="checked"></td>
          <td width="100%">When one of my orders needs feedback</td>
        </tr>
      </table>
    </form>
  </body>
</html>
